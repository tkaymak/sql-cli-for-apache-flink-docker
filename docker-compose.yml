services:
  kafka:
    container_name: kafka
    image: apache/kafka:4.1.1
    mem_limit: 512m
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=32m"
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 2
      KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: 16777216
      KAFKA_LOG_SEGMENT_BYTES: 16777216
      KAFKA_LOG_RETENTION_HOURS: 24
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka-init:
    container_name: kafka-init
    image: apache/kafka:4.1.1
    mem_limit: 256m
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - 'for t in orders orders_avro beam_product_counts; do /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$t" --partitions 1 --replication-factor 1; done'

  jobmanager:
    container_name: jobmanager
    build:
      context: ./flink
    image: flink-playground-flink:2.2.1
    mem_limit: 768m
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 512m
        jobmanager.memory.jvm-metaspace.size: 128m
        jobmanager.memory.off-heap.size: 64m
        jobmanager.memory.jvm-overhead.min: 64m
        jobmanager.memory.jvm-overhead.max: 64m
        parallelism.default: 1
        env.java.opts.all: -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=48m -Xss512k
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  taskmanager:
    container_name: taskmanager
    build:
      context: ./flink
    image: flink-playground-flink:2.2.1
    mem_limit: 1536m
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 8
        taskmanager.memory.process.size: 896m
        taskmanager.memory.managed.size: 96m
        taskmanager.memory.framework.heap.size: 64m
        taskmanager.memory.framework.off-heap.size: 32m
        taskmanager.memory.network.min: 48m
        taskmanager.memory.network.max: 64m
        taskmanager.memory.jvm-metaspace.size: 160m
        taskmanager.memory.jvm-overhead.min: 64m
        taskmanager.memory.jvm-overhead.max: 64m
        parallelism.default: 1
        env.java.opts.all: -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=48m -Xss512k
    depends_on:
      jobmanager:
        condition: service_started

  sql-client:
    container_name: sql-client
    build:
      context: ./sql-client
      args:
        FAKER_JAR_URL: ${FAKER_JAR_URL:-https://github.com/tkaymak/flink-faker/releases/download/v0.6.0/flink-faker-0.6.0.jar}
    image: flink-playground-sql-client:2.2.1
    mem_limit: 512m
    command: ["sleep", "infinity"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        rest.address: jobmanager
        rest.port: 8081
        parallelism.default: 1
        env.java.opts.client: -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xmx256m
    volumes:
      - ./examples:/opt/sql-client/examples:ro
    depends_on:
      jobmanager:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  console:
    container_name: console
    profiles:
      - ui
      - all
    image: redpandadata/console:v3.12.0
    mem_limit: 128m
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: kafka:9092
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: http://schema-registry:8085
    depends_on:
      kafka:
        condition: service_healthy

  schema-registry:
    container_name: schema-registry
    profiles:
      - avro
      - all
    image: confluentinc/cp-schema-registry:8.2.4
    mem_limit: 512m
    ports:
      - "8085:8085"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8085
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms128m -Xmx256m"
      SCHEMA_REGISTRY_JVM_PERFORMANCE_OPTS: "-XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=32m"
    depends_on:
      kafka:
        condition: service_healthy

  postgres:
    container_name: postgres
    profiles:
      - postgres
      - all
    image: postgres:18.6
    mem_limit: 256m
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: flink
      POSTGRES_PASSWORD: flink
      POSTGRES_DB: playground
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flink -d playground"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20", "-c", "work_mem=2MB"]

  beam-client:
    container_name: beam-client
    profiles:
      - beam
      - all
    build:
      context: ./beam
    image: flink-playground-beam:2.76.0
    mem_limit: 1536m
    network_mode: "service:taskmanager"
    command: ["sleep", "infinity"]
    volumes:
      - ./beam/data:/data
    depends_on:
      taskmanager:
        condition: service_started
